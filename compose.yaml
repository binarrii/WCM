services:
  mysql:
    image: mysql:8.4
    container_name: wcm-review-tasks-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Use a non-default host port to avoid colliding with an existing MySQL.
      - "127.0.0.1:${WCM_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: ${WCM_REVIEW_TASKS_DB_NAME:-wcm}
      MYSQL_USER: ${WCM_REVIEW_TASKS_DB_USER:-wcm}
      MYSQL_PASSWORD: ${WCM_REVIEW_TASKS_DB_PASSWORD:-wcm}
      MYSQL_ROOT_PASSWORD: ${WCM_MYSQL_ROOT_PASSWORD:-wcm-root}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - wcm-network
    volumes:
      - review-tasks-mysql-data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Some deployment hosts do not provide DNS inside Docker's build
      # bridge. Set WCM_BUILD_NETWORK=host there; keep the portable default.
      network: ${WCM_BUILD_NETWORK:-default}
    container_name: wcm-facerec-api
    ports:
      - "8000:8000"
    environment:
      - GUNICORN_WORKERS=4
      - WCM_API_HOST=0.0.0.0
      - WCM_API_PORT=8000
      - WCM_REVIEW_TASK_CONCURRENCY=${WCM_REVIEW_TASK_CONCURRENCY:-4}
      - WCM_REVIEW_WINDOW_CONCURRENCY=${WCM_REVIEW_WINDOW_CONCURRENCY:-3}
      - WCM_VISUAL_TIMEOUT_S=${WCM_VISUAL_TIMEOUT_S:-50}
      - WCM_OCR_TIMEOUT_S=${WCM_OCR_TIMEOUT_S:-10}
      - WCM_GUARD_TIMEOUT_S=${WCM_GUARD_TIMEOUT_S:-10}
      - WCM_INSIGHTFACE_TIMEOUT_S=${WCM_INSIGHTFACE_TIMEOUT_S:-10}
      - WCM_NSFW_IMAGE_MODE=${WCM_NSFW_IMAGE_MODE:-auto}
      - WCM_NSFW_VERIFY_TARGET=${WCM_NSFW_VERIFY_TARGET:-false}
      - WCM_NSFW_SAMPLING_MODE=${WCM_NSFW_SAMPLING_MODE:-scene}
      - WCM_NSFW_SCENE_MAX_STRIDE=${WCM_NSFW_SCENE_MAX_STRIDE:-3}
      - WCM_NSFW_SCENE_CUT_THRESHOLD=${WCM_NSFW_SCENE_CUT_THRESHOLD:-27}
      - WCM_NSFW_REVIEW_MODE=${WCM_NSFW_REVIEW_MODE:-window}
      - WCM_NSFW_WINDOW_MAX_SECONDS=${WCM_NSFW_WINDOW_MAX_SECONDS:-10}
      - WCM_INSIGHTFACE_BASE_URL=${WCM_INSIGHTFACE_BASE_URL:-http://10.252.25.251:18097}
      - WCM_INSIGHTFACE_API_KEY=${WCM_INSIGHTFACE_API_KEY:-}
      - WCM_INSIGHTFACE_VERIFY_SIMILARITY_THRESHOLD=${WCM_INSIGHTFACE_VERIFY_SIMILARITY_THRESHOLD:-0.5}
      - WCM_FACE_PROFILE_OPTIMIZATION=${WCM_FACE_PROFILE_OPTIMIZATION:-true}
      - WCM_FACE_CROP_PADDING=${WCM_FACE_CROP_PADDING:-0.25}
      - WCM_FACE_CANDIDATE_SIMILARITY=${WCM_FACE_CANDIDATE_SIMILARITY:-0.35}
      - WCM_FACE_HIGH_SIMILARITY=${WCM_FACE_HIGH_SIMILARITY:-0.65}
      - WCM_FACE_MIN_CANDIDATE_MARGIN=${WCM_FACE_MIN_CANDIDATE_MARGIN:-0.05}
      - WCM_FACE_MIN_CONFIRMING_FRAMES=${WCM_FACE_MIN_CONFIRMING_FRAMES:-2}
      - WCM_FACE_PROFILE_POSE_THRESHOLD=${WCM_FACE_PROFILE_POSE_THRESHOLD:-0.60}
      - WCM_FACE_LOW_SHARPNESS_THRESHOLD=${WCM_FACE_LOW_SHARPNESS_THRESHOLD:-0.15}
      - WCM_FACE_TRACK_MAX_GAP_S=${WCM_FACE_TRACK_MAX_GAP_S:-2.5}
      - WCM_FACE_NEIGHBOR_OFFSETS_S=${WCM_FACE_NEIGHBOR_OFFSETS_S:-[-0.4,-0.2,0.2,0.4]}
      - WCM_FACE_MAX_EXTRA_FRAMES_PER_WINDOW=${WCM_FACE_MAX_EXTRA_FRAMES_PER_WINDOW:-3}
      - WCM_FACE_MAX_EXTRA_CALL_RATIO=${WCM_FACE_MAX_EXTRA_CALL_RATIO:-0.30}
      - WCM_FACE_NEIGHBOR_CONCURRENCY=${WCM_FACE_NEIGHBOR_CONCURRENCY:-2}
      - WCM_FACE_GALLERY_TARGET_SAMPLES=${WCM_FACE_GALLERY_TARGET_SAMPLES:-5}
      - WCM_REVIEW_TASKS_DB_ENABLED=true
      - WCM_REVIEW_TASKS_DB_HOST=mysql
      - WCM_REVIEW_TASKS_DB_PORT=3306
      - WCM_REVIEW_TASKS_DB_NAME=${WCM_REVIEW_TASKS_DB_NAME:-wcm}
      - WCM_REVIEW_TASKS_DB_USER=${WCM_REVIEW_TASKS_DB_USER:-wcm}
      - WCM_REVIEW_TASKS_DB_PASSWORD=${WCM_REVIEW_TASKS_DB_PASSWORD:-wcm}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wcm-network
    volumes:
      # Keep the existing host image library visible inside the container.
      # Override WCM_IMAGE_DIR when deploying from a different host path.
      - ${WCM_IMAGE_DIR:-/tmp/wcm}:/tmp/wcm

networks:
  wcm-network:
    driver: bridge

volumes:
  review-tasks-mysql-data:

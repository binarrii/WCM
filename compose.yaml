services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wcm-facerec-api
    ports:
      - "8000:8000"
    environment:
      - GUNICORN_WORKERS=4
      - WCM_API_HOST=0.0.0.0
      - WCM_API_PORT=8000
    restart: unless-stopped
    networks:
      - wcm-network
    # /tmp/wcm is hardcoded as the upload directory by FaceEngine._persist_image
    # (see src/wcm_facerec/face_engine.py). Nginx / FastAPI's /images static
    # mount serves it from the same path inside the container.
    tmpfs:
      - /tmp/wcm:size=2G

networks:
  wcm-network:
    driver: bridge
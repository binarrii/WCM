services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # Some deployment hosts do not provide DNS inside Docker's build
      # bridge. Set WCM_BUILD_NETWORK=host there; keep the portable default.
      network: ${WCM_BUILD_NETWORK:-default}
    container_name: wcm-facerec-api
    ports:
      - "8000:8000"
    environment:
      - GUNICORN_WORKERS=4
      - WCM_API_HOST=0.0.0.0
      - WCM_API_PORT=8000
      - WCM_INSIGHTFACE_BASE_URL=${WCM_INSIGHTFACE_BASE_URL:-http://10.252.25.251:18097}
      - WCM_INSIGHTFACE_API_KEY=${WCM_INSIGHTFACE_API_KEY:-}
    restart: unless-stopped
    networks:
      - wcm-network
    volumes:
      # Keep the existing host image library visible inside the container.
      # Override WCM_IMAGE_DIR when deploying from a different host path.
      - ${WCM_IMAGE_DIR:-/tmp/wcm}:/tmp/wcm

networks:
  wcm-network:
    driver: bridge

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · 视频审核时间轴</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101521;color:#e8eef8}
*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1500px;margin-inline:auto}
header{margin-bottom:24px}h1{font-size:25px;margin:8px 0}h2{font-size:17px;margin:0}
p{color:#aebcd0;line-height:1.6}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:24px}
.panel{background:#192131;border:1px solid #303c51;border-radius:16px;padding:20px;min-width:0}
video{display:block;width:100%;max-height:65vh;background:#000;border-radius:10px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
button,select,input{font:inherit;color:inherit;background:#25334a;border:1px solid #526782;border-radius:7px;padding:8px 12px}
button{cursor:pointer}button:hover,button:focus-visible{background:#334965;outline:2px solid #8db8ff}button:disabled{opacity:.4;cursor:default}
.seek{width:100%;padding:0;accent-color:#8db8ff}
.timeline{position:relative;min-height:36px;margin:12px 0;background:repeating-linear-gradient(transparent 0 16px,#48576c 16px 18px,transparent 18px 24px)}
.marker{position:absolute;top:8px;width:12px;height:18px;padding:0;background:#ffbd66;border:0;border-radius:4px}
.marker.range{background:#a9a0ff}
.marker.active{background:#fff;outline:2px solid #ffbd66}.marker:hover{background:#fff}
.scale{display:flex;justify-content:space-between;color:#aebcd0;font-size:12px}.hint{font-size:12px;margin-bottom:0}
.badge{display:inline-block;color:#ffcc8a;background:#593f20;padding:4px 9px;border-radius:20px;font-size:12px}
#events{max-height:65vh;overflow:auto;margin-top:16px;display:grid;gap:10px}
.event{display:block;text-align:left;width:100%;padding:12px;background:#202c40}.event.active{border-color:#ffbd66;background:#342e28}
.event strong{display:block;color:#ffcc8a;font-size:14px;margin-bottom:6px}.event span{display:block;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:13px}
#message{color:#ffd18b}#clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}
@media(max-width:850px){body{padding:16px}main{grid-template-columns:1fr}#events{max-height:40vh}}
</style>
</head>
<body>
<header><span class="badge">WCM · 人工复核</span><h1>__TITLE__</h1>
<p>按接口时间戳定位待复核画面。人物区间表示连续采样命中，其他结果保留单点；点击标记或条目跳到起点。标记不是违规结论，区间边界受采样精度限制。</p></header>
<main>
<section class="panel" aria-label="视频与时间轴">
<video id="video" controls preload="metadata" src="marked.mp4"></video>
<p id="message" role="status"></p>
<div class="toolbar"><button id="prev">上一标记</button><button id="next">下一标记</button><span id="clock">00:00:00.000</span></div>
<label for="seek">视频进度</label><input class="seek" id="seek" type="range" min="0" max="1" step="0.001" value="0">
<div id="timeline" class="timeline" aria-label="审核标记"></div>
<div class="scale"><span>00:00</span><span id="duration"></span></div>
<p class="hint">紫色条：人物合并区间；橙色点：单次命中。重叠标记分行显示。</p>
<p class="hint">章节副本：marked.mp4。原始结果：analysis.json。播放器章节功能的显示方式可能不同，此页提供独立可点击时间轴。</p>
</section>
<aside class="panel"><h2 id="summary">审核标记</h2><div class="toolbar"><label for="category">类别</label><select id="category"><option value="">全部类别</option></select></div><div id="events"></div></aside>
</main>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('review-data').textContent);
const video=document.getElementById('video'),seek=document.getElementById('seek');
const timeline=document.getElementById('timeline'),events=document.getElementById('events');
const category=document.getElementById('category'),message=document.getElementById('message');
const prev=document.getElementById('prev'),next=document.getElementById('next');
const duration=data.duration_ms/1000;seek.max=duration;
function stamp(seconds){let ms=Math.round(seconds*1000);const h=Math.floor(ms/3600000);ms%=3600000;const m=Math.floor(ms/60000);ms%=60000;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(Math.floor(ms/1000)).padStart(2,'0')}.${String(ms%1000).padStart(3,'0')}`;}
document.getElementById('duration').textContent=stamp(duration);
let visible=data.markers;
const categories=[...new Set(data.markers.flatMap(m=>m.findings.map(f=>f.category)))];
categories.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;category.append(option);});
function revealEvent(index){
  const row=events.children[index];if(!row||!events.clientHeight)return;
  const bounds=row.getBoundingClientRect(),top=events.getBoundingClientRect().top+events.clientTop;
  const bottom=top+events.clientHeight;
  // Scroll this list only; scrollIntoView would also move the page/video.
  // Oversized descriptions cannot fit, so reveal their timestamp/header first.
  if(bounds.top<top||bounds.height>events.clientHeight)events.scrollTop+=Math.floor(bounds.top-top);
  else if(bounds.bottom>bottom)events.scrollTop+=Math.ceil(bounds.bottom-bottom);
}
function jump(index){
  if(index<0||index>=visible.length)return;
  video.currentTime=visible[index].time_ms/1000;update();revealEvent(index);
}
function layoutMarkers(){
  const width=Math.max(timeline.clientWidth,12),lanes=[];
  timeline.querySelectorAll('button').forEach((tick,index)=>{
    const m=visible[index],end=m.end_time_ms??m.time_ms;
    const left=Math.min(width-12,m.time_ms/data.duration_ms*width);
    const size=Math.min(width-left,Math.max(12,(end-m.time_ms)/data.duration_ms*width));
    let lane=lanes.findIndex(right=>right+4<=left);if(lane<0)lane=lanes.length;
    lanes[lane]=left+size;tick.style.left=`${left}px`;tick.style.width=`${size}px`;tick.style.top=`${8+lane*24}px`;
  });
  timeline.style.height=`${Math.max(1,lanes.length)*24+12}px`;
}
function render(){
  timeline.replaceChildren();events.replaceChildren();
  visible=data.markers.filter(m=>!category.value||m.findings.some(f=>f.category===category.value));
  document.getElementById('summary').textContent=`${visible.length} 条标记 · 共 ${data.markers.length} 条`;
  visible.forEach((m,index)=>{
    const details=m.findings.map(f=>`${f.category}：${f.description}`).join('\n');
    const tick=document.createElement('button');tick.className='marker';tick.classList.toggle('range',(m.end_time_ms??m.time_ms)>m.time_ms);
    tick.title=m.timestamp+'\n'+details;tick.setAttribute('aria-label','跳转 '+m.timestamp);tick.onclick=()=>jump(index);timeline.append(tick);
    const row=document.createElement('button');row.className='event';row.onclick=()=>jump(index);
    const time=document.createElement('strong');time.textContent=m.timestamp;
    const text=document.createElement('span');text.textContent=details;row.append(time,text);events.append(row);
  });
  if(!visible.length){const empty=document.createElement('p');empty.textContent='没有审核标记。无标记不代表内容安全。';events.append(empty);}
  layoutMarkers();update();
}
function update(){
  const current=video.currentTime||0;seek.value=current;document.getElementById('clock').textContent=stamp(current);
  const active=m=>{const start=m.time_ms/1000,end=(m.end_time_ms??m.time_ms)/1000;return end>start?current>=start-0.05&&current<=end+0.05:Math.abs(start-current)<0.1;};
  timeline.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',active(visible[i])));
  events.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',active(visible[i])));
  prev.disabled=!visible.some(m=>m.time_ms/1000<current-0.05);
  next.disabled=!visible.some(m=>m.time_ms/1000>current+0.05);
}
prev.onclick=()=>{for(let i=visible.length-1;i>=0;i--){if(visible[i].time_ms/1000<video.currentTime-0.05){jump(i);break;}}};
next.onclick=()=>jump(visible.findIndex(m=>m.time_ms/1000>video.currentTime+0.05));
seek.oninput=()=>{video.currentTime=Number(seek.value);update();};category.onchange=render;
video.addEventListener('timeupdate',update);
video.addEventListener('loadedmetadata',()=>{message.textContent='';update();});
window.addEventListener('resize',layoutMarkers);
video.addEventListener('error',()=>{message.textContent='无法播放视频：请确保 marked.mp4 和本页在同一目录；若浏览器不支持原视频编码，请用支持章节的播放器打开 marked.mp4。';});
render();
</script>
</body>
</html>

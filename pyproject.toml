[project]
name = "wcm-facerec"
version = "0.1.0"
description = "Large Scale Face Recognition with InsightFace Server + pgvector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.10.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "pgvector>=0.3.1",
    "numpy>=2.2.0",
    "pillow>=11.1.0",
    "httpx>=0.28.1",
    # Used by FaceEngine._to_bytes for the legacy np.ndarray img_source
    # overload. The InsightFace adapter itself uses PIL only, but the
    # public FaceEngine API still accepts arrays for back-compat with
    # main.py and scripts/.
    "opencv-python-headless>=4.10.0.20241230",
    "xlrd>=2.0.2",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.26",
    # The InsightFace Server Python SDK is vendored under
    # src/wcm_facerec/vendor/insightface_server/. Upgrade by replacing the
    # vendored directory contents and bumping _VENDORED.md.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wcm_facerec"]

[tool.hatch.build.targets.wheel.sources]
"wcm_facerec" = "src/wcm_facerec"

[tool.pytest.ini_options]
markers = [
    "live: hits the live InsightFace Server — gated on RUN_LIVE=1",
]

# --- Ruff ---
# Lint + format + import-sort. Vendored SDK and generated bytecode are
# excluded; the project's own code is the target.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "src/wcm_facerec/vendor",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
# E/W/pyflakes by default; F (pyflakes) catches unused imports/vars.
# I (isort) for import order; B (bugbear) for common pitfalls;
# UP (pyupgrade) for modern Python idioms; C4 (comprehensions).
# SIM (simplify) for obvious simplifications.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
# E501 is auto-disabled by ruff when line-length is set; ignore a few
# project-specific exceptions.
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # function-call-in-default-arg (FastAPI uses Depends() patterns)
    "B904",   # raise-from inside except — cosmetic, ruff formatter-friendly
    "SIM108", # ternary-over-if-else — readability judgement
    "SIM117", # combine-stmts-with-with — leaves clearer for async
]

[tool.ruff.lint.per-file-ignores]
# Scripts, root-level CLI tools, and one-off docs/dev scripts are
# scratch/legacy and exempted from most rules.
"scripts/*" = ["B", "E402", "E722", "F401", "F841"]
"main.py" = ["E402"]                # CLI tool — imports after shebang
"app_wrapper.py" = ["E402"]         # legacy DeepFace entry point
"docs/*" = ["B", "E402", "E711", "E722", "F401", "F841"]
"test_tensorflow_init.py" = ["E402"] # legacy one-shot probe
"tests/*" = ["B", "F401", "F811", "SIM105"]  # test files import & reimport freely
"src/wcm_facerec/vendor/**" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["wcm_facerec", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"